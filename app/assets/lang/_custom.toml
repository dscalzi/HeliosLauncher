# Custom Language File — «Пепел Эдема»

[ejs.app]
title = "Пепел Эдема"

[ejs.landing]
mediaGitHubURL = "https://github.com/ILCHIK3000/pepel-launcher"
mediaXURL = "#"
mediaInstagramURL = "#"
mediaYouTubeURL = "#"
mediaDiscordURL = "#"

[ejs.settings]
sourceGithubLink = "https://github.com/ILCHIK3000/pepel-launcher"
supportLink = "https://github.com/ILCHIK3000/pepel-launcher/issues"
pepelAccount = "Аккаунт «Пепел Эдема»"
addPepelAccount = "+ Добавить аккаунт"

[ejs.welcome]
welcomeHeader = "ПЕПЕЛ ЭДЕМА"
welcomeDescription = "Мир, переживший падение Эдема. Шесть измерений, три школы магии и история, которую предстоит собрать по осколкам. Твой путь начинается в Приюте."
welcomeDescCTA = "До входа в мир — один шаг."

[ejs.login]
loginSubheader = "ВХОД В ПЕПЕЛ ЭДЕМА"
loginNickPlaceholder = "НИК"
loginNickError = "* Неверный ник"
loginCodePlaceholder = "КОД ДОСТУПА (PEPEL-XXXX-XXXX)"
loginCodeError = "* Неверный код"
loginConsentText = "Принимаю правила проекта"
loginButtonText = "ВОЙТИ"
loginCancelText = "Отмена"
loginCodeDisclaimer = "Код доступа выдаётся ботом после оформления подписки. Код привязывается к устройству."

[js.login]
login = "ВОЙТИ"
loggingIn = "ПРОВЕРКА..."
success = "ГОТОВО"
tryAgain = "Попробовать ещё раз"

[js.login.error]
invalidValue = "* Неверное значение"
requiredValue = "* Обязательное поле"
invalidNick = "* Ник: 3–16 символов, латиница, цифры, _"
invalidCode = "* Формат кода: PEPEL-XXXX-XXXX"

[js.login.error.unknown]
title = "Неизвестная ошибка входа"
desc = "Произошла неизвестная ошибка. Попробуй ещё раз."

[js.auth.pepel.error]
unreachableTitle = "Сервер проверки недоступен"
unreachableDesc = "Не удалось связаться с сервером «Пепла Эдема». Проверь интернет и попробуй ещё раз."
inactiveTitle = "Код не активен"
inactiveDesc = "Код не найден или подписка не активна. Проверь код или обратись к боту проекта."
